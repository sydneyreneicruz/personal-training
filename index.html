!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Governance DSL Form Builder</title>
    <script type="module" crossorigin src="https://gradio-lite-previews.s3.amazonaws.com/PINNED_HF_HUB/dist/lite.js"></script>
    <link rel="stylesheet" href="https://gradio-lite-previews.s3.amazonaws.com/PINNED_HF_HUB/dist/lite.css" />
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        gradio-lite {
            flex: 1;
            display: flex;
        }
    </style>
</head>
<body>
    <gradio-lite>
        <gradio-file name="app.py" entrypoint>
            import gradio as gr
            def greet(name):
                return "Hello " + name + "!"
            demo = gr.Interface(fn=greet, inputs="textbox", outputs="textbox")
            demo.launch()
        </gradio-file>
    </gradio-lite>
</body>
</html>
